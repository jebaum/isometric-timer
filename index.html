<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#18151f">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="A quiet, guided isometric-hold interval timer.">
    <title>Isometric</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body data-kind="hold" data-state="ready">
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="./icons/icon-192.png" width="32" height="32" alt="">
          <span>ISOMETRIC</span>
        </div>
        <div class="topbar-actions">
          <button id="install-button" class="text-button" type="button" hidden>Install</button>
          <button id="settings-button" class="icon-button" type="button" aria-label="Routine settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M10 14v6" />
            </svg>
          </button>
        </div>
      </header>

      <main class="timer-card">
        <div class="phase-heading">
          <p id="run-status" class="run-status" aria-live="polite">READY</p>
          <h1 id="phase-label">RIGHT SIDE</h1>
        </div>

        <div id="countdown" class="countdown" role="timer" aria-label="35 seconds remaining">35</div>

        <div class="progress-track" aria-hidden="true">
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div class="routine-meta">
          <div>
            <span class="meta-label">TOTAL</span>
            <strong id="total-left">9:30</strong>
          </div>
          <div>
            <span class="meta-label">CYCLE</span>
            <strong id="cycle-count">1 / 4</strong>
          </div>
        </div>

        <div class="next-phase">
          <span class="meta-label">NEXT</span>
          <strong id="next-label">SWITCH</strong>
        </div>

        <div class="controls">
          <button id="start-button" class="primary-button" type="button">Start</button>
          <button id="skip-button" class="secondary-button" type="button" disabled>Skip</button>
        </div>

        <button id="reset-button" class="reset-button" type="button" disabled>End routine</button>
      </main>

      <footer class="app-footer">
        <span id="wake-dot" class="status-dot" aria-hidden="true"></span>
        <span id="wake-status">Works offline after first visit</span>
      </footer>
    </div>

    <dialog id="settings-dialog" class="settings-dialog">
      <form id="settings-form">
        <div class="dialog-heading">
          <div>
            <p class="run-status">ROUTINE</p>
            <h2>Timer settings</h2>
          </div>
          <button id="close-settings" class="icon-button" type="button" aria-label="Close settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>

        <div class="settings-grid">
          <label>
            <span>Cycles</span>
            <input id="cycles-input" name="cycles" type="number" inputmode="numeric" min="1" max="99" step="1" required>
          </label>
          <label>
            <span>Hold <small>seconds</small></span>
            <input id="hold-input" name="hold" type="number" inputmode="numeric" min="1" max="3600" step="1" required>
          </label>
          <label>
            <span>Switch <small>seconds</small></span>
            <input id="switch-input" name="switch" type="number" inputmode="numeric" min="0" max="3600" step="1" required>
          </label>
          <label>
            <span>Rest <small>seconds</small></span>
            <input id="rest-input" name="rest" type="number" inputmode="numeric" min="0" max="3600" step="1" required>
          </label>
        </div>

        <p id="routine-preview" class="routine-preview">4 cycles · 9:30 total</p>

        <div class="dialog-actions">
          <button id="restore-defaults" class="secondary-button" type="button">Defaults</button>
          <button class="primary-button" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
